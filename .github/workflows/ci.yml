name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  # Windows timers are coarser (about 15.6 ms by default) and have caught
  # timing bugs that Linux did not. No race detector here: it needs cgo.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...

  # The LiveKit transport against a real LiveKit server in development mode:
  # its integration tests, then the CLI against the LiveKit fake agent.
  livekit:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      CALLSWARM_LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start LiveKit
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:v1.13.9 \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:7880 > /dev/null; do sleep 0.5; done'
      - name: Test
        run: go test -race -count=1 ./transport/livekit
      - name: Run callswarm
        run: |
          go build -o callswarm ./cmd/callswarm
          ./callswarm fake-agent --transport livekit > agent.log 2>&1 &
          ./callswarm run examples/smoke/scenario.yaml --transport livekit \
            --calls 6 --concurrency 3 \
            --max-first-audio p95=750ms --max-stop-latency p95=300ms \
            --min-reply-rate 1 --min-stop-rate 1
      - name: LiveKit logs
        if: failure()
        run: |
          docker logs livekit
          cat agent.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Must be built with a Go at least as new as go.mod's.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0